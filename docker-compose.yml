version: '3.8'

services:
  # 1. MongoDB Service (For local development testing)
  mongo:
    image: mongo:latest
    container_name: elc_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db # Persists your database even if the container stops
    networks:
      - elc_network

  # 2. Backend Node.js Service
  backend:
    build: 
      context: ./backend
    container_name: elc_backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      # Use the MongoDB container's name ('mongo') as the host in the URI
      - MONGO_URI=mongodb://mongo:27017/elc_db
      - PORT=5000
      # Add other environment variables from your backend/.env here
      # - JWT_SECRET=your_secret_here
    depends_on:
      - mongo
    networks:
      - elc_network

  # 3. Frontend React/Vite Service
  frontend:
    build:
      context: ./frontend
    container_name: elc_frontend
    ports:
      - "80:80" # Maps port 80 on your machine to port 80 in the Nginx container
    depends_on:
      - backend
    networks:
      - elc_network

# Define the network so the containers can communicate using their service names
networks:
  elc_network:
    driver: bridge

# Define the volume for database persistence
volumes:
  mongo_data: